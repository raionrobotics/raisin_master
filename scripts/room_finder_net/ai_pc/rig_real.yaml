# Real robot: three OAK-D Pro W (PoE) attached to the AI PC.  Use with:  ai_main.py --cameras local --rig rig_real.yaml
# TODO (measure / decide before the first run):
#   * which camera looks where (yaw: 0 = forward, +pi/2 = left, -pi/2 = right) and its `ip`
#   * mount_xyz: position of the camera mast in the frame of the robot's /Odometry/base pose (x forward, y left, z up).
#     z = height of the cameras above the odometry origin (eye height on the carbon pipe).
# Camera 192.168.1.104 answers for TWO devices (1944301051A1984800 and 19443010E19A984800): give one of them another IP first.
topics:
  odom: /Odometry/base
  rgb: "{cam}/rgb"
  depth: "{cam}/depth"
cameras:
  oak_front: {yaw: 0.0, ip: 192.168.1.103}
  oak_left:  {yaw: 1.5707963267948966, ip: 192.168.1.104}       # placeholder, see the note above
  # oak_right: {yaw: -1.5707963267948966, ip: 192.168.1.10x}    # third camera: IP not known yet
mount_xyz: [0.0, 0.0, 1.3]          # PLACEHOLDER
sensor_offset: 0.02
color: {width: 1920, height: 1440, fps: 5}   # 4:3, JPEG-encoded on the camera; plates need ~30 px
depth: {width: 640, height: 480}             # aligned to the colour sensor
hfov: 1.885                                  # overwritten from the camera calibration at start-up
oak: {ir_dot: 0.0, mjpeg_quality: 90}
